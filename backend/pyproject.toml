[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coffie-bot-backend"
version = "0.1.0"
description = "Backend for the standalone Coffie Bot loyalty application"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = [
    "aiogram==3.30.0",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "fastapi==0.139.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    "SQLAlchemy[asyncio]==2.0.51",
    "structlog==26.1.0",
    "tzdata==2026.3",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]
# Published Alembic revisions are immutable; preserve this legacy migration byte-for-byte.
extend-exclude = ["alembic/versions/0002_ensure_default_loyalty_settings.py"]

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "DTZ", "E", "F", "I", "PT", "RUF", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
