sonar.projectKey=Cofie-Bot
sonar.projectName=Coffie-Bot
sonar.sourceEncoding=UTF-8

# Keep generated files, binary design assets and published migrations outside
# the maintainability signal. Migrations are immutable after release.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/test
sonar.exclusions=frontend/src/test/**,**/*.d.ts,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/test/**/*.ts,frontend/src/test/**/*.tsx
sonar.coverage.exclusions=backend/tests/**,frontend/src/test/**

sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.scm.provider=git
